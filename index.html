<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Molly's Bus Buddies</title>
  <meta name="description" content="A calm, colourful bus-planning puzzle for Molly. No ads, no timer, works offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bus Buddies">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#B6E04A">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Title screen -->
  <section id="screen-title" class="screen" aria-label="Title">
    <h1 class="big-title">Molly's<br>Bus Buddies</h1>
    <canvas id="title-art" width="320" height="200" aria-hidden="true"></canvas>
    <div class="stack">
      <button id="btn-play" class="pill pill-big" type="button">Play</button>
      <button id="btn-levels" class="pill" type="button">Levels</button>
      <button id="btn-how" class="pill pill-soft" type="button">How to play</button>
    </div>
  </section>

  <!-- Level select -->
  <section id="screen-levels" class="screen" aria-label="Choose a level" hidden>
    <h2 class="screen-heading">Choose a level</h2>
    <div id="level-grid" class="level-grid"></div>
    <button id="btn-levels-back" class="pill pill-soft" type="button">Back</button>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen screen-game" aria-label="Game" hidden>
    <canvas id="board" aria-label="Bus station. Tap a bus to send it to a loading bay."></canvas>
    <header class="hud">
      <div class="hud-title">Molly's Bus Buddies</div>
      <div class="hud-level" id="hud-level">Level 1</div>
    </header>
    <button id="btn-pause" class="pause" type="button" aria-label="Pause"><span></span><span></span></button>
    <footer class="controls">
      <div class="control-row">
        <button id="btn-undo" class="disc" type="button" aria-label="Undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 11.5 9 16" /><path d="M4.5 11.5H14a5 5 0 0 1 0 10h-3" /></svg>
          <span>Undo</span>
        </button>
        <button id="btn-restart" class="disc" type="button" aria-label="Restart">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" /><path d="M19 4v4.5h-4.5" /></svg>
          <span>Restart</span>
        </button>
      </div>
      <p class="hint" id="hint">Only the front person can hop on</p>
    </footer>
  </section>

  <!-- Overlays -->
  <div id="overlay" class="overlay" hidden>
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <h2 id="card-title"></h2>
      <div id="card-body" class="card-body"></div>
      <div id="card-actions" class="card-actions"></div>
    </div>
  </div>

  <div id="stuck" class="stuck" role="status" hidden>
    <p>All the bays are full. Try Undo.</p>
    <div class="card-actions">
      <button id="stuck-undo" class="pill" type="button">Undo</button>
      <button id="stuck-keep" class="pill pill-soft" type="button">Keep looking</button>
    </div>
  </div>
</body>
</html>
